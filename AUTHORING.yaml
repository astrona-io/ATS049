- id: section-020
  title: Rates and Derivatives
  curriculum_item: Rates and Derivatives
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Counters, rate And increase
    objectives:
    - Explain what a counter is and why `rate()` is the right function for it.
    - Choose a range for `rate()` that holds enough samples for the scrape interval.
    - Predict the value of `rate()` and `increase()` for a counter that grows by a
      constant amount.
    - Choose between `rate()`, `increase()` and `irate()` for a graph, an alert and
      a quick look at a spike.
    - Explain how Prometheus detects a counter reset and what it adds back.
    - Write `sum by (...)` and `sum without (...)` over `rate()` and explain why `rate(sum(...))`
      is wrong.
    outline:
    - Counters, rate() And Window Sizing
    - increase(), irate() And What Each Function Returns
    - Counter Resets And Aggregated Rates
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-01/course-01-counters-rate-and-window-sizing.md
      adapted_from: 
    - reading: sections/section-020/module-01/course-02-increase-irate-and-what-each-returns.md
      adapted_from: 
    - reading: sections/section-020/module-01/course-03-counter-resets-and-aggregated-rates.md
      adapted_from: 
    labs:
    - id: lab-01
      path: sections/section-020/module-01/labs/lab-01
      after_reading: sections/section-020/module-01/course-03-counter-resets-and-aggregated-rates.md
      objective: Write rate, increase and irate expressions for counters
      status: alpha
      runtime_verification: pending
  - id: module-02
    title: 'Gauges: delta, deriv And predict_linear'
    objectives:
    - Decide whether a metric is a counter or a gauge from its behaviour, and name
      the function family for each.
    - Use `delta()` and `idelta()` to measure the change of a gauge over a range or
      between the last two samples.
    - Explain why `rate()` gives a wrong result on a gauge that goes down.
    - Use `deriv()` to measure the speed of change of a gauge in units per second.
    - Use `predict_linear()` to predict a value, and to compute the time until a disk
      is full.
    - Describe how simple linear regression picks the line, and what the range does
      to the answer.
    - Use `changes()` and `resets()` to count value changes and counter resets.
    - Choose between all the counter and gauge functions for a given question.
    outline:
    - delta(), idelta() And When A Gauge Is Not A Counter
    - deriv() And predict_linear()
    - changes(), resets() And Choosing The Right Function
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-02/course-01-delta-idelta-and-gauges.md
      adapted_from: 
    - reading: sections/section-020/module-02/course-02-deriv-and-predict-linear.md
      adapted_from: 
    - reading: sections/section-020/module-02/course-03-changes-resets-and-choosing-the-function.md
