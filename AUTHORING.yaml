  - id: module-02
    title: Subqueries And Nested Time Aggregation
    objectives:
    - Write a subquery with an explicit step and with the default step, and say what
      the default step is.
    - State at which times Prometheus evaluates the inner expression of a subquery
      and which of them belong to the range.
    - Combine an over_time function with `sum by` and `rate()` to find the peak, the
      lowest value or the average of a computed value over time.
    - Explain why the maximum of a sum and the sum of maximums are different results.
    - Count the evaluations that a subquery makes, and explain when a recording rule
      is cheaper.
    - 'Avoid the common mistakes: aggregating a counter before `rate()`, a step that
      is longer than the inner range, and a range that holds one point.'
