- id: section-030
  title: Aggregating Over Time
  curriculum_item: Aggregating over time
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: The over_time Functions
    objectives:
    - Explain what a range vector is and which samples a range such as `[5m]` selects.
    - Use `avg_over_time`, `min_over_time`, `max_over_time`, `sum_over_time` and `count_over_time`
      and say what each returns per series.
    - Use `quantile_over_time` and `stddev_over_time` to describe how a gauge is spread
      over a window.
    - Use `last_over_time`, `present_over_time` and `absent_over_time` to find the
      newest value of a series and to detect a series that has no samples.
    - Choose a window that holds enough samples for the scrape interval and long enough
      to cover the pattern you look for.
    - Explain why `avg_over_time` of a counter and an average of ratios mislead, and
      name the correct alternative.
    outline:
    - Aggregating A Gauge Over A Window
    - Quantiles, Spread, Last Value And Presence
    - Choosing The Window And Avoiding Misleading Averages
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-01/course-01-aggregating-a-gauge-over-a-window.md
