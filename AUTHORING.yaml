- id: section-010
  title: Selecting Data
  curriculum_item: Selecting Data
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Selectors, Matchers And The Series Model
    objectives:
    - 'Explain what a time series is and which parts of it identify it: the metric
      name and the set of label pairs.'
    - Write selectors with the four matchers `=`, `!=`, `=~` and `!~`, and predict
      which series each one selects.
    - Explain that a regular expression matcher is fully anchored, and that a matcher
      for an empty value also selects series that do not have the label.
    - Explain why a selector needs at least one matcher that cannot match the empty
      string, and select by metric name with `__name__`.
    - Name the four PromQL types (instant vector, range vector, scalar and string)
      and write a range selector with a valid duration.
    - Count the series a selector returns with `count` and `count by`, and use the
      count to check a selection.
    outline:
    - 'The Series Model: Samples, Names And Labels'
    - The Four Label Matchers
    - Expression Types, Range Selectors And Counting
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-series-metric-names-and-labels.md
      adapted_from: 
    - reading: sections/section-010/module-01/course-02-the-four-label-matchers.md
