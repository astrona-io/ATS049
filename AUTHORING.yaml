    objectives:
    - 'State how an instant vector selector chooses a sample: the newest sample in
      the lookback window that ends at the evaluation time.'
    - Explain staleness, and explain why a series with no recent samples is absent
      from a result without any error.
    - Move a selector in time with `offset`, including a negative offset, and pin
