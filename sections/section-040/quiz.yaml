# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats049-040
course_id: ATS049
exam_code: PCA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Aggregating over dimensions"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats049-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Predict the label set of a result from a by clause or a without clause"
    source_readings:
      - sections/section-040/module-01/course-01-aggregation-operators-by-and-without.md
    prompt: "The series of `up` have the labels `job` and `instance`. Which labels does the result of `sum by (job) (up)` have?"
    options:
      - id: a
        text: "`job` and `instance`, because the series had them."
        explanation: "`by` keeps only the labels it names, so `instance` is removed."
      - id: b
        text: "Only `job`. The metric name and `instance` are removed."
        explanation: "Correct. `by (job)` keeps only the named label, and aggregation removes the metric name."
      - id: c
        text: "`__name__` and `job`, because the metric name stays."
        explanation: "Aggregation removes the metric name unless `__name__` is listed in `by`."
    correct_option: b
    explanation: "Correct. `by (job)` keeps only the named label, and aggregation removes the metric name."

  - id: ats049-040-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the label set of a result from a by clause or a without clause"
    source_readings:
      - sections/section-040/module-01/course-01-aggregation-operators-by-and-without.md
    prompt: "The series of `http_requests_total` have the labels `job`, `instance`, `method` and `status`. Which labels does `sum without (instance, method) (http_requests_total)` return?"
    options:
      - id: a
        text: "`job` only."
        explanation: "`without` keeps every label that it does not name, so more than `job` remains."
      - id: b
        text: "`instance` and `method`."
        explanation: "These are the labels that `without` removes, not the ones it keeps."
      - id: c
        text: "`job` and `status`."
        explanation: "Correct. `without` removes the named labels and keeps all others. The metric name is removed as well."
    correct_option: c
    explanation: "Correct. `without` removes the named labels and keeps all others. The metric name is removed as well."

  - id: ats049-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why aggregation removes the metric name and every label that is not kept"
    source_readings:
      - sections/section-040/module-01/course-01-aggregation-operators-by-and-without.md
    prompt: "What does `sum(no_such_metric)` return when no series with that name exists?"
    options:
      - id: a
        text: "An empty result, with no series."
        explanation: "Correct. Aggregation over an empty input returns nothing, not a zero."
      - id: b
        text: "A single series with the value `0`."
        explanation: "Prometheus does not invent a value for an empty input."
      - id: c
        text: "An error, because the metric is unknown."
        explanation: "Selecting a metric that does not exist is not an error. The selector returns no series."
    correct_option: a
    explanation: "Correct. Aggregation over an empty input returns nothing, not a zero."

  - id: ats049-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write sum by (...) (rate(...)) and explain why the rate comes before the sum"
    source_readings:
      - sections/section-040/module-01/course-02-sum-of-rate-by-instance-and-mode.md
    prompt: "Why must you write `sum by (job) (rate(http_requests_total[5m]))` and not take the rate of the summed counters?"
    options:
      - id: a
        text: "`sum` cannot be applied to a counter at all."
        explanation: "`sum` works on counters. The problem is the order, not the operator."
      - id: b
        text: "`rate` runs faster on one summed series than on many series."
        explanation: "Speed is not the reason. The result would be less correct."
      - id: c
        text: "Summing first would hide a counter reset of one target inside the total, so the rate would be wrong."
        explanation: "Correct. `rate` can only see resets in single series. After a sum, the reset of one target looks like a fall of the total."
    correct_option: c
    explanation: "Correct. `rate` can only see resets in single series. After a sum, the reset of one target looks like a fall of the total."

  - id: ats049-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write sum by (...) (rate(...)) and explain why the rate comes before the sum"
    source_readings:
      - sections/section-040/module-01/course-02-sum-of-rate-by-instance-and-mode.md
    prompt: "A host has two CPU cores. What is the value of `sum by (instance) (rate(node_cpu_seconds_total[5m]))` for that host, summed over all modes?"
    options:
      - id: a
        text: "About 2, because each core adds one second of CPU time per second."
        explanation: "Correct. A core is always in exactly one mode, so the rates of all modes add up to the number of cores."
      - id: b
        text: "About 1, because the host has one instance."
        explanation: "The sum counts the seconds of every core, not the number of instances."
      - id: c
        text: "About 0.5, the share of idle time."
        explanation: "The share of idle time is a different quantity and needs a division."
    correct_option: a
    explanation: "Correct. A core is always in exactly one mode, so the rates of all modes add up to the number of cores."

  - id: ats049-040-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Count targets and series with count, count by and a count of a count"
    source_readings:
      - sections/section-040/module-01/course-03-count-and-cardinality-up.md
    prompt: "Which expression returns the number of targets of each job that are working right now?"
    options:
      - id: a
        text: "`count by (job) (up)`"
        explanation: "This counts the reporting targets, whether they work or not."
      - id: b
        text: "`sum by (job) (up)`"
        explanation: "Correct. The value of `up` is 1 for a working target and 0 for a failed one, so the sum is the number of working targets."
      - id: c
        text: "`max by (job) (up)`"
        explanation: "This returns 1 when at least one target works, not how many."
    correct_option: b
    explanation: "Correct. The value of `up` is 1 for a working target and 0 for a failed one, so the sum is the number of working targets."

  - id: ats049-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the up metric to find targets that are down and targets that have vanished"
    source_readings:
      - sections/section-040/module-01/course-03-count-and-cardinality-up.md
    prompt: "The target `probe-1` stopped sending samples 10 minutes ago. What does `count by (job) (up)` show for its job at the current time?"
    options:
      - id: a
        text: "A count that is one lower, because the stale series is not in the result."
        explanation: "Correct. After the 5-minute lookback the series is no longer selected, so it is neither counted as up nor as down."
      - id: b
        text: "The same count as before, with `up` equal to 0 for `probe-1`."
        explanation: "Prometheus does not write a zero for a target that vanished."
      - id: c
        text: "An error, because the series disappeared."
        explanation: "A missing series is not an error. The result just has fewer series."
    correct_option: a
    explanation: "Correct. After the 5-minute lookback the series is no longer selected, so it is neither counted as up nor as down."

  - id: ats049-040-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Count targets and series with count, count by and a count of a count"
    source_readings:
      - sections/section-040/module-01/course-03-count-and-cardinality-up.md
    prompt: "Which expression returns the number of different values of the label `team` in the metric `team_info`?"
    options:
      - id: a
        text: "`count(team_info)`"
        explanation: "This counts series, which can be more than the number of different teams."
      - id: b
        text: "`count by (team) (team_info)`"
        explanation: "This returns one series for each team, not one number."
      - id: c
        text: "`count(count by (team) (team_info))`"
        explanation: "Correct. The inner `count by (team)` makes one series per team, and the outer `count` counts them."
    correct_option: c
    explanation: "Correct. The inner `count by (team)` makes one series per team, and the outer `count` counts them."

  - id: ats049-040-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Select the highest or lowest series with topk and bottomk, and explain why the result keeps all original labels"
    source_readings:
      - sections/section-040/module-02/course-01-topk-and-bottomk.md
    prompt: "What does `topk by (job) (1, queue_depth)` return?"
    options:
      - id: a
        text: "One value for each job, with only the label `job`."
        explanation: "This describes `max by (job)`. `topk` does not remove labels."
      - id: b
        text: "For each job, the series with the highest value, with the metric name and all labels."
        explanation: "Correct. `by` only forms the groups that are ranked, and the selected series come out unchanged."
      - id: c
        text: "The single highest series of all jobs together."
        explanation: "With `by (job)` the ranking runs for each job, not once for all."
    correct_option: b
    explanation: "Correct. `by` only forms the groups that are ranked, and the selected series come out unchanged."

  - id: ats049-040-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Rank series inside each group with by and without, and predict what happens when values are equal"
    source_readings:
      - sections/section-040/module-02/course-01-topk-and-bottomk.md
    prompt: "The four series of `up` all have the value 1. What does `topk(2, up)` return?"
    options:
      - id: a
        text: "All four series, because they are tied."
        explanation: "`topk` returns at most k series, so tied series are cut."
      - id: b
        text: "An empty result, because a tie is ambiguous."
        explanation: "A tie is not an error and does not empty the result."
      - id: c
        text: "Exactly two series, but which two is not defined."
        explanation: "Correct. Prometheus returns k series, and the choice among tied values is not specified."
    correct_option: c
    explanation: "Correct. Prometheus returns k series, and the choice among tied values is not specified."

  - id: ats049-040-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compute a quantile, a standard deviation and a variance across series"
    source_readings:
      - sections/section-040/module-02/course-02-quantile-stddev-count-values.md
    prompt: "The three series of `queue_depth` have the values 25, 30 and 280. What does `quantile(0.5, queue_depth)` return?"
    options:
      - id: a
        text: "About 111.7, the mean of the three values."
        explanation: "The mean is `avg`. A quantile picks a position in the sorted values."
      - id: b
        text: "30, the middle value of the sorted values."
        explanation: "Correct. A φ of 0.5 is the median of the values across the series."
      - id: c
        text: "The 50th percentile of the request durations."
        explanation: "Durations come from `histogram_quantile` on buckets. This aggregation works across series."
    correct_option: b
    explanation: "Correct. A φ of 0.5 is the median of the values across the series."

  - id: ats049-040-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why the average of per-instance averages is wrong, and write the weighted form"
    source_readings:
      - sections/section-040/module-02/course-03-correct-averaging-and-hidden-failures.md
    prompt: "Instance A handled 200 requests with an average duration of 0.15 s. Instance B handled 100 requests with 0.4 s. Which value is the correct average over both?"
    options:
      - id: a
        text: "About 0.233 s, the total duration divided by the total number of requests."
        explanation: "Correct. The total duration is 30 plus 40 seconds, and the total is 300 requests."
      - id: b
        text: "About 0.275 s, the mean of 0.15 and 0.4."
        explanation: "This gives both instances the same weight although A handled twice as many requests."
      - id: c
        text: "0.55 s, the sum of the two averages."
        explanation: "Adding averages has no meaning as an average of the requests."
    correct_option: a
    explanation: "Correct. The total duration is 30 plus 40 seconds, and the total is 300 requests."
