# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Counters, rate And increase (LAB). Graded against the live Prometheus server. UNTESTED: built
# without a live run.
apiVersion: astrona.io/v1
metadata:
  name: ats-049-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/prometheus/prometheus:v3.5.5
      - docker.io/library/python:3.13-alpine

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/prometheus
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet

# Applied only by `astrona test`: the reference solution (writes the answers).
testing:
  init:
    - name: apply-solution
      description: Write the reference answers
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: request-rate-per-instance
      description: "q1 returns the request rate per instance and job, without method and status"
      type: file
      source: validation/validate-request-rate-per-instance.sh
      hint: "Take rate() of each series over 5m first, then sum without (method, status)."
    - name: error-increase-per-instance
      description: "q2 returns the increase of 500 responses over 10 minutes per instance"
      type: file
      source: validation/validate-error-increase-per-instance.sh
      hint: "Select status=\"500\", use increase() with a 10m range, then sum by (instance)."
    - name: bridge-rate-across-restart
      description: "q3 returns the bridge request rate at the time after the restart, rate taken before the sum"
      type: file
      source: validation/validate-bridge-rate-across-restart.sh
      hint: "Use sum(rate(http_requests_total{job=\"bridge\"}[5m])) and test it with --time 1767227550. Do not use a subquery."
    - name: post-instant-rate
      description: "q4 returns the instant rate of POST requests per bridge instance"
      type: file
      source: validation/validate-post-instant-rate.sh
      hint: "Use irate() on the POST series of job bridge, then sum by (instance)."
    - name: error-ratio-per-job
      description: "q5 returns the share of 500 responses per job"
      type: file
      source: validation/validate-error-ratio-per-job.sh
      hint: "Divide sum by (job) of the 500 rate by sum by (job) of the total rate. Both sides need the same label set."

teardown:
  keepCluster: false
